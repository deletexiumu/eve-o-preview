doc = "一组的标题。"

[IntelStrings.locationHelp]
doc = "一组的说明。"

[IntelStrings.locationUnknown]
doc = "位置未知。"

[IntelStrings.locationValue]
doc = "位置的文字：星系（来源，多久以前）。"
params = ["system: String", "source: String", "age: String"]

[IntelStrings.sourceGameLog]
doc = "来源：游戏日志。"

[IntelStrings.sourceLocal]
doc = "来源：本地频道。"

[IntelStrings.sourceManual]
doc = "来源：手动。"

[IntelStrings.systemPlaceholder]
