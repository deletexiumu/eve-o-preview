# translation 域的键：每条的用途、参数与所在分节。各语言的文字在 ../<语言>/translation.toml。

swift_file = "TranslationStrings"
notes = """
翻译域的文字（docs/macos/design-intel-translate.md 第 11 节）：「翻译」页、翻译浮窗的标题与状态行、失败的原因。
第 11 节的 55 条之外另有 2 条：keyOptional（自定义接口的 Key 可不填）与 keychainError（钥匙串写入或删除失败）。
把失败、接口问题与队列状态换成文字的对应写在 macOS 的 TranslationStrings+Status.swift，各语言共用。"""

[protocols.TranslationStrings]
doc = "翻译域的文字。"
accessor = "translation"

[TranslationStrings.pageSubtitle]
section = "页头与状态"
doc = "页标题下的一句说明。"

[TranslationStrings.enableToggle]
doc = "总开关。"

[TranslationStrings.statusLabel]
doc = "状态行的标签。"

[TranslationStrings.statusOff]
doc = "状态：未启用。"

[TranslationStrings.statusIdle]
doc = "状态：就绪。"

[TranslationStrings.statusTranslating]
doc = "状态：翻译中。"

[TranslationStrings.statusWaiting]
doc = "状态：几秒后重试，附原因。"
params = ["seconds: Int", "reason: String"]

[TranslationStrings.statusBlocked]
doc = "状态：已暂停，附原因。"
params = ["_ reason: String"]

[TranslationStrings.retryNow]
doc = "「立即重试」按钮。"

[TranslationStrings.failureMissingBaseURL]
section = "失败的原因"
doc = "没有接口地址。"

[TranslationStrings.failureMissingModel]
doc = "没有模型名。"

[TranslationStrings.failureInvalidURL]
doc = "接口地址的格式不对。"

[TranslationStrings.failureInsecureHTTP]
doc = "公网的 http 地址。"

[TranslationStrings.failureMissingKey]
doc = "没有 Key。"

[TranslationStrings.failureKeychain]
doc = "读不到钥匙串里的 Key。"

[TranslationStrings.failureUnauthorized]
doc = "Key 无效，附状态码。"
params = ["status: Int"]

[TranslationStrings.failureNotFound]
doc = "地址或模型名不对。"

[TranslationStrings.failureBalance]
doc = "余额不足。"

[TranslationStrings.failureRejected]
doc = "请求被拒绝，附状态码与服务给的说明。"
params = ["status: Int", "message: String"]
select = "message"
cases = ["empty", "other"]

[TranslationStrings.failureRateLimited]
doc = "限流或额度用完。"

[TranslationStrings.failureServer]
doc = "服务出错，附状态码。"
params = ["status: Int"]

[TranslationStrings.failureNetwork]
doc = "连不上。"

[TranslationStrings.failureMalformed]
doc = "答复的格式不对。"

[TranslationStrings.failureRefused]
doc = "模型拒绝了这批消息。"

[TranslationStrings.failureTruncated]
doc = "答复被截断。"

[TranslationStrings.channelsHelp]
section = "频道与目标语言"
doc = "频道列表的说明。"

[TranslationStrings.targetHeader]
doc = "目标语言一组的标题。"

[TranslationStrings.targetLanguage]
doc = "「翻译成」。"

[TranslationStrings.targetFollowUI]
doc = "「跟随界面语言」。"

[TranslationStrings.showOriginal]
doc = "「同时显示原文」。"

[TranslationStrings.foreignOnly]
doc = "「只显示翻译过的消息」。"

[TranslationStrings.modelHeader]
section = "模型服务"
doc = "模型一组的标题。"

[TranslationStrings.provider]
doc = "「服务」。"

[TranslationStrings.providerCustom]
doc = "「其他（OpenAI 兼容接口）」。"

[TranslationStrings.baseURL]
doc = "「接口地址」。"

[TranslationStrings.model]
doc = "「模型名」。"

[TranslationStrings.apiKey]
doc = "「API Key」。"

[TranslationStrings.apiKeyStored]
doc = "「已保存在钥匙串」。"

[TranslationStrings.apiKeyPlaceholder]
doc = "Key 输入框的占位文字。"

[TranslationStrings.saveKey]
doc = "「保存」。"

[TranslationStrings.deleteKey]
doc = "「删除 Key」。"

[TranslationStrings.keyNotRequired]
doc = "「这个服务不用 Key」。"

[TranslationStrings.keyOptional]
doc = "自定义接口：要 Key 时填写，不要时留空。"

[TranslationStrings.keychainError]
doc = "钥匙串写入或删除失败，附 OSStatus。"
params = ["status: Int32"]

[TranslationStrings.test]
doc = "「测试」。"

[TranslationStrings.testing]
doc = "「测试中…」。"

[TranslationStrings.testSucceeded]
doc = "测试成功，附译文。"
params = ["_ text: String"]

[TranslationStrings.testFailed]
doc = "测试失败，附原因。"
params = ["_ reason: String"]

[TranslationStrings.cacheHeader]
section = "缓存与说明"
doc = "译文缓存一组的标题。"

[TranslationStrings.cacheCount]
doc = "缓存的条数。"
params = ["_ count: Int"]
plural = "count"

[TranslationStrings.clearCache]
doc = "「清空缓存」。"

[TranslationStrings.privacyNote]
doc = "页尾的隐私说明。"

[TranslationStrings.costNote]
doc = "页尾的费用说明。"

[TranslationStrings.overlayTitle]
section = "浮窗"
doc = "浮窗标题，附角色名。"
params = ["_ character: String"]

[TranslationStrings.statusNoChannels]
doc = "状态行：没有设置翻译频道。"

[TranslationStrings.statusNoLogFiles]
doc = "状态行：近 48 小时里，活动角色在所选的每个翻译频道都没有日志文件（EVE 没有写入）。channels 是频道的显示名。"
params = ["_ channels: [String]"]

[TranslationStrings.statusNoLogFilesBuiltIn]
doc = "同上，所缺的频道里有内置频道（本地、军团、联盟、舰队）时用：EVE（Mac 版）客户端语言不是英文时不写系统频道的\n日志（2026-11 在用户本机确认：中文客户端不写，切成 English 后立即恢复），提示里直接给出办法。"
params = ["_ channels: [String]"]

[TranslationStrings.pending]
doc = "等待翻译的状态词。"

[TranslationStrings.failed]
doc = "翻译失败的状态词。"
