doc = "滚动到最新。"

[OverlayStrings.menuCopyLine]
doc = "复制光标下的那一条。"

[OverlayStrings.menuOpenInBrowser]
doc = "「在浏览器中打开」子菜单（6.9 节增补）。"

[OverlayStrings.menuClear]
doc = "清空活动角色在这个浮窗里的列表。"

[OverlayStrings.menuLockLayout]
doc = "锁定布局（带勾选）。"

[OverlayStrings.menuResetFrame]
