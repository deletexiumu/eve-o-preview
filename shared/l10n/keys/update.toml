# update 域的键：每条的用途、参数与所在分节。各语言的文字在 ../<语言>/update.toml。

swift_file = "UpdateStrings"
notes = """
更新域的文字（v1.1 设计 11.4 节）：菜单栏的「检查更新…」与提示项、「通用」页的更新一组、更新窗口。
用词按 v1.1 设计 11.3 节与反馈文档 5.5 节的词表。
各语言只写每种原因与每类错误的一句话；从 InstallBlocker、UpdateError 到句子的对应写在 macOS 的 UpdateStrings+Format.swift。
文件大小与时刻按界面语言对应的 Locale 格式化（UpdateTextFormat），不另设文字键。"""

[protocols.UpdateStrings]
doc = "更新域的全部文字。"
accessor = "updates"
slint = true

[UpdateStrings.menuCheckForUpdates]
section = "菜单栏菜单"
doc = "工具项「检查更新…」。"

[UpdateStrings.menuUpdateAvailable]
doc = "顶部的提示项：有可用更新，参数是新版本号。"
params = ["_ version: String"]

[UpdateStrings.menuRestartToUpdate]
doc = "顶部的提示项：新版本已下载好，点击后安装并重新启动；参数是新版本号。更新窗口的同名按钮也用它。"
params = ["_ version: String"]

[UpdateStrings.sectionHeader]
section = "「通用」页的更新一组"
doc = "一组的标题。"

[UpdateStrings.autoCheckToggle]
doc = "「自动检查更新」开关。"

[UpdateStrings.autoCheckHelp]
doc = "「自动检查更新」的说明。"

[UpdateStrings.autoInstallToggle]
doc = "「自动安装更新」开关。"

[UpdateStrings.autoInstallHelp]
doc = "「自动安装更新」的说明。"

[UpdateStrings.notAvailableYet]
doc = "Windows 测试版：更新功能还没做，「通用」页更新一组下的说明。"
platforms = ["windows"]

[UpdateStrings.currentVersionLabel]
doc = "「当前版本」一行的标签。"

[UpdateStrings.lastCheckedLabel]
doc = "「上次检查」一行的标签。"

[UpdateStrings.lastCheckedNever]
doc = "从来没有检查过。"

[UpdateStrings.checkNowButton]
doc = "「立即检查」按钮；更新窗口在空闲时也用它。"

[UpdateStrings.statusChecking]
section = "状态行（「通用」页与更新窗口）"
doc = "检查中。"

[UpdateStrings.statusUpToDate]
doc = "已是最新版本。"

[UpdateStrings.statusAvailable]
doc = "有新版本，参数是版本号。"
params = ["_ version: String"]

[UpdateStrings.statusReady]
doc = "新版本已下载，退出时安装；参数是版本号。"
params = ["_ version: String"]

[UpdateStrings.statusRateLimited]
doc = "GitHub 限流，参数是可以再试的时刻（已按界面语言格式化）。"
params = ["_ time: String"]

[UpdateStrings.statusRateLimitedLater]
doc = "GitHub 限流，可以再试的时刻未知。"

[UpdateStrings.statusUnavailable]
doc = "这个构建整个停用更新功能（不是从 .app 运行）。"

[UpdateStrings.windowTitle]
section = "更新窗口"
doc = "窗口标题。"

[UpdateStrings.headline]
doc = "标题行，参数是新版本号。"
params = ["_ version: String"]

[UpdateStrings.currentVersionLine]
doc = "标题下一行，参数是正在运行的版本。"
params = ["_ version: String"]

[UpdateStrings.releaseNotesHeader]
doc = "发布说明上方的小标题。"

[UpdateStrings.versionNotesTitle]
doc = "跳过了几个版本时，每个版本的说明前的小标题，参数是版本号（8.8 节）。"
params = ["_ version: String"]

[UpdateStrings.earlierVersionsOnReleasePage]
doc = "中间版本没有列全时，说明最后的一行：更早版本的内容请看发布页。"

[UpdateStrings.installButton]
doc = "「安装更新」按钮。"

[UpdateStrings.installHelp]
doc = "「安装更新」下方的说明。"

[UpdateStrings.skipButton]
