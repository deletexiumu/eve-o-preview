hotkeyRulesHint = { macos = "Tastatur-Hotkeys brauchen Control (⌃), Wahltaste (⌥) oder Befehlstaste (⌘), außer F1–F20 und Ziffern des Ziffernblocks. Mittlere und seitliche Maustasten gehen auch allein; der Klick wird nicht an das Spiel weitergegeben.", windows = "Tastatur-Hotkeys brauchen Strg, Alt oder Win, außer F1–F20 und Ziffern des Ziffernblocks; Systemkombinationen wie Alt+Tab oder Win+L gehen nicht. Unterstützt werden nur die mittlere und die zwei seitlichen Maustasten; aufgenommene Maus-Hotkeys gelten standardmäßig nur in EVE, damit andere Programme ihre Seitentasten behalten." }
mouseHotkeyHint = "Maus-Hotkeys brauchen die Berechtigung „Bedienungshilfen“. Eine Maustaste mit Bereich „Überall“ wird in jeder App abgefangen. Andere Belegungen der Taste im Spiel oder in der Maussoftware vorher entfernen."

defaultScopeLabel = "Standardbereich für Hotkeys"
