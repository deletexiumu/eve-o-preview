defaultScopeFooter = { macos = "Jeder Hotkey hat genau einen Bereich, nie beide zugleich. Die Markierung rechts neben jedem Hotkey zeigt den tatsächlich verwendeten Bereich. Ein Klick darauf stellt diesen einen Hotkey auf Überall, Nur in EVE oder den hier gewählten Standard.", windows = "Tastenkürzel mit „Standard“ folgen dieser Auswahl; Tastenkürzel mit eigenem Bereich (global oder nur in EVE) nicht. Eine neu aufgenommene Maustaste erhält den eigenen Bereich „nur in EVE“, damit sie diese Taste in anderen Apps nicht abfängt (etwa „Zurück“ im Browser)." }
