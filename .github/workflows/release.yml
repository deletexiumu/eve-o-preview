# SPDX-License-Identifier: GPL-3.0-or-later
#
# 发布（1.4.0 起）：macOS 与 Windows 用同一个版本号、同一个 v* tag、同一个 GitHub Release 一起发布。
# - 推送 v* tag：先查两个平台的版本号与 tag 一致，再调用 macos.yml 与 windows.yml 构建、测试、打包，
#   最后在 publish 任务里把两边的文件放进一个 Release：dmg、Windows zip、两边的源码包、合并的 SHA256SUMS.txt
#   与它的 ed25519 签名 SHA256SUMS.txt.sig。正式版标为 latest；版本号带 - 时是预发布，不标 latest。
# - 手动运行（默认演练）：同样构建打包，建一个草稿 Release（不打 tag、不公开），看完后在 Releases 页面删掉。
#
# 已安装客户端的兼容（docs/windows/architecture.md 7.4 节）：
# - macOS 各版本读 /releases/latest，按名字取自己的 dmg，在 SHA256SUMS.txt 里只找 dmg 那一行，多出的附件与行不影响。
# - Windows 1.4.0 起两种 tag 都认，`v*` 只认带 Windows 压缩包的 Release。1.0、1.1 只认 `win-v*`：
#   WINDOWS_LEGACY_TAG_VERSIONS 里列出的版本额外发一个只含 Windows 文件的 `win-v<版本>`（不标 latest），
#   让它们能自动升级。目前只有 1.4.0。
# 签名私钥只在 publish 任务里用（Linux 运行器、Actions secret），不进构建用的运行器。
# 第三方 action 钉到提交 SHA，行尾注释写对应的版本号。

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      rehearse_release:
        description: 演练：建草稿 Release，不打 tag、不公开
        type: boolean
        default: true

# 默认只读；只有 publish 任务单独提升为可写。
permissions:
  contents: read

# 同一个 tag 不并行，也不取消正在跑的发布。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 额外发 win-v<版本> 的版本，空格分隔。只认 win-v* 的 Windows 1.0、1.1 靠它升到统一发布的版本。
  WINDOWS_LEGACY_TAG_VERSIONS: "1.4.0"

jobs:
  # 两个平台的版本号必须相同；推送 tag 时 tag 必须是 v<版本号>。手动运行只能演练，不能正式发布。
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 版本号与 tag
        id: check
        env:
          REHEARSAL: ${{ github.event_name == 'workflow_dispatch' }}
          REHEARSE_INPUT: ${{ inputs.rehearse_release }}
        run: |
          if [[ "$REHEARSAL" == "true" ]]; then
            [[ "$REHEARSE_INPUT" == "true" ]] || { echo "::error::手动运行只能演练；正式发布请推送 v<版本号> 的 tag"; exit 1; }
            python3 scripts/check_versions.py
          else
            python3 scripts/check_versions.py --tag "$GITHUB_REF_NAME"
          fi
          echo "version=$(tr -d '[:space:]' < macos/VERSION)" >> "$GITHUB_OUTPUT"

  macos:
    needs: versions
    uses: ./.github/workflows/macos.yml
    with:
      rehearse_release: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit

  windows:
    needs: versions
    uses: ./.github/workflows/windows.yml
    with:
      rehearse_release: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit

  publish:
    needs: [versions, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # 只为读发布说明、公钥与脚本，不留写权限的凭据。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: EVE-O-Preview-${{ needs.macos.outputs.label }}
          path: macos-files

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release-${{ needs.windows.outputs.label }}
          path: windows-files

      # 合并：两边各自的校验和先核对一遍，再把两个文件的行合在一起按文件名排序。文件名不能重复。
      # release-files 是统一 Release 的附件；legacy-files 是 win-v<版本> 用的，只有 Windows 的文件与它自己的校验和。
      - name: 合并附件与校验和
        env:
          MAC_LABEL: ${{ needs.macos.outputs.label }}
          WIN_LABEL: ${{ needs.windows.outputs.label }}
        run: |
          (cd macos-files && sha256sum -c SHA256SUMS.txt)
          (cd windows-files && sha256sum -c SHA256SUMS.txt)
          mkdir release-files legacy-files
          cp windows-files/* legacy-files/
          for dir in macos-files windows-files; do
            for f in "$dir"/*; do
              [[ "$(basename "$f")" == SHA256SUMS.txt ]] || cp "$f" release-files/
            done
          done
          cat macos-files/SHA256SUMS.txt windows-files/SHA256SUMS.txt | grep -v '^[[:space:]]*$' | sort -k2 > release-files/SHA256SUMS.txt
          DUPLICATES="$(awk '{print $2}' release-files/SHA256SUMS.txt | uniq -d)"
          [[ -z "$DUPLICATES" ]] || { echo "::error::两个平台有同名文件：${DUPLICATES}"; exit 1; }
          (cd release-files && sha256sum -c SHA256SUMS.txt)
          # 契约：两边的安装包都在，校验和里各有一行（应用按这两个名字找）。
          for name in "EVE-O-Preview-${MAC_LABEL}.dmg" "EVE-O-Preview-${WIN_LABEL}-windows-x64.zip"; do
            grep -q "  ${name}\$" release-files/SHA256SUMS.txt || { echo "::error::SHA256SUMS.txt 里没有 ${name}"; exit 1; }
          done
          cat release-files/SHA256SUMS.txt

      # 签名：私钥种子在 secret WINDOWS_UPDATE_SIGNING_KEY 里（64 位十六进制），只经环境变量传给 Python 写成临时的
      # PKCS#8 文件，签完即删；签名前核对它的公钥与提交的公钥一致，签完再用提交的公钥验一遍。
      # 签名文件是一行 base64（docs/windows/architecture.md 6.3 节第 3 条）。两个校验和文件各签一份。
      - name: 签名
        env:
          SIGNING_KEY: ${{ secrets.WINDOWS_UPDATE_SIGNING_KEY }}
        run: |
          [[ -n "$SIGNING_KEY" ]] || { echo "::error::缺少 secret WINDOWS_UPDATE_SIGNING_KEY"; exit 1; }
          umask 077
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          # ed25519 私钥的 PKCS#8 DER = 固定前缀 + 32 字节种子；公钥的 SPKI DER = 固定前缀 + 32 字节公钥。
          python3 -c 'import os,sys; seed=bytes.fromhex(os.environ["SIGNING_KEY"].strip()); assert len(seed)==32; sys.stdout.buffer.write(bytes.fromhex("302e020100300506032b657004220420")+seed)' > "$WORK/key.der"
          PUBLIC="$(tr -d '[:space:]' < windows/packaging/update-public-key.txt)"
          DERIVED="$(openssl pkey -inform DER -in "$WORK/key.der" -pubout -outform DER | tail -c 32 | python3 -c 'import sys; print(sys.stdin.buffer.read().hex())')"
          if [[ "$DERIVED" != "$PUBLIC" ]]; then
            echo "::error::secret 里的私钥与 windows/packaging/update-public-key.txt 的公钥不配对"
            exit 1
          fi
          python3 -c 'import sys; sys.stdout.buffer.write(bytes.fromhex("302a300506032b6570032100"+sys.argv[1]))' "$PUBLIC" > "$WORK/pub.der"
          for dir in release-files legacy-files; do
            openssl pkeyutl -sign -keyform DER -inkey "$WORK/key.der" -rawin -in "$dir/SHA256SUMS.txt" -out "$WORK/sig.bin"
            base64 -w0 "$WORK/sig.bin" > "$dir/SHA256SUMS.txt.sig"
            printf '\n' >> "$dir/SHA256SUMS.txt.sig"
            openssl pkeyutl -verify -pubin -keyform DER -inkey "$WORK/pub.der" -rawin -in "$dir/SHA256SUMS.txt" -sigfile "$WORK/sig.bin"
          done
          # macOS：dmg 与 2 个源码包；Windows：zip 与源码包；再加校验和与签名。
          [[ "$(ls release-files | wc -l | tr -d ' ')" == "7" ]] || { echo "::error::附件数不是 7"; ls release-files; exit 1; }
          [[ "$(ls legacy-files | wc -l | tr -d ' ')" == "4" ]] || { echo "::error::win-v 的附件数不是 4"; ls legacy-files; exit 1; }

      # 说明取 docs/release-notes/v<VERSION>.md（按平台分节）。正式发布时必须有；演练时没有就让 GitHub 自动生成。
      # 版本号带 - 时标为预发布、不标 latest；否则标为 latest（已安装的 macOS 客户端靠 /releases/latest 检查更新）。
      # Release 已存在时不覆盖附件：已经发出去的文件和校验和不应被悄悄换掉，要重发请打新的版本号。
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.versions.outputs.version }}
          REHEARSAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          NOTES="docs/release-notes/v${VERSION}.md"
          if [[ "$REHEARSAL" == "true" ]]; then
            TAG="v${VERSION}-rehearsal.${GITHUB_RUN_NUMBER}"
            args=(--draft --prerelease --latest=false --target "$GITHUB_SHA")
          else
            TAG="$GITHUB_REF_NAME"
            args=(--verify-tag)
            [[ -f "$NOTES" ]] || { echo "::error::缺少发布说明 ${NOTES}"; exit 1; }
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "::error::Release ${TAG} 已存在，不覆盖附件"
              exit 1
            fi
            if [[ "$VERSION" == *-* ]]; then
              args+=(--prerelease --latest=false)
            else
              args+=(--latest)
            fi
          fi
          args+=(--repo "$GITHUB_REPOSITORY" --title "EVE-O Preview ${VERSION}")
          if [[ -f "$NOTES" ]]; then
            args+=(--notes-file "$NOTES")
          else
            args+=(--generate-notes)
          fi
          gh release create "$TAG" release-files/* "${args[@]}"
          echo "已建 Release：${TAG}"

      # 只认 win-v* 的 Windows 1.0、1.1 的过渡：列出的版本再发一个只含 Windows 文件的 win-v<版本>，tag 打在同一个提交上，
      # 不标 latest。演练时不发。
      - name: 过渡用的 win-v Release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.versions.outputs.version }}
        run: |
          if [[ " ${WINDOWS_LEGACY_TAG_VERSIONS} " != *" ${VERSION} "* ]]; then
            echo "${VERSION} 不在 WINDOWS_LEGACY_TAG_VERSIONS 里，不发 win-v"
            exit 0
          fi
          TAG="win-v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release ${TAG} 已存在，不覆盖附件"
            exit 1
          fi
          args=(--target "$GITHUB_SHA" --latest=false --repo "$GITHUB_REPOSITORY"
                --title "EVE-O Preview for Windows ${VERSION}" --notes-file "docs/release-notes/v${VERSION}.md")
          [[ "$VERSION" == *-* ]] && args+=(--prerelease)
          gh release create "$TAG" legacy-files/* "${args[@]}"
          echo "已建 Release：${TAG}"

      # /releases/latest 必须是 v* 的 tag（已安装的 macOS 客户端靠它检查更新）；正式版发布后应正是这次的 tag。
      - name: 核对 latest
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.versions.outputs.version }}
        run: |
          LATEST="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          echo "latest：${LATEST}"
          if [[ "$LATEST" != v* ]]; then
            echo "::error::/releases/latest 是 ${LATEST}，不是 v* 的 tag；请在 Releases 页面把 v${VERSION} 设为 latest"
            exit 1
          fi
          if [[ "$VERSION" != *-* && "$LATEST" != "v${VERSION}" ]]; then
            echo "::error::/releases/latest 是 ${LATEST}，应是 v${VERSION}"
            exit 1
          fi
