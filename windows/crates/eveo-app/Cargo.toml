# SPDX-License-Identifier: GPL-3.0-or-later
#
# Windows 版的可执行文件（架构文档 3.1 节）：把 eveo-app-core 的协调器接到 eveo-platform-win 的窗口、
# 热键、钩子与托盘上，主循环是 Slint 的事件循环（W7 已验证原生窗口与钩子能在里面共存）。
# 只在 Windows 上有内容；其他系统上编译成一个只打印说明的空壳，工作区在 Linux 上照样能 cargo test。

[package]
name = "eveo-app"
description = "EVE-O Preview Windows 版的可执行文件"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "eve-o-preview"
path = "src/main.rs"

# 把应用图标编进 exe（build.rs）。只在 Windows 主机上实际调用。
[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
eveo-core.workspace = true
eveo-l10n.workspace = true
eveo-app-core.workspace = true
eveo-platform-win.workspace = true
eveo-ui = { path = "../eveo-ui" }
raw-window-handle.workspace = true
windows.workspace = true
slint = { workspace = true, features = ["backend-winit", "renderer-software", "raw-window-handle-06"] }
# 应用的 Slint 平台包了一层 winit 后端：浮窗用离屏的软件渲染窗口，其余窗口照常交给 winit（slint_platform 模块）。
# 版本必须与 slint 完全一致：包装要转交几个只在内部使用的平台方法。
i-slint-backend-winit = { version = "=1.19.0", default-features = false, features = ["renderer-software"] }
i-slint-core = { version = "=1.19.0", default-features = false }

[lints]
workspace = true
