# SPDX-License-Identifier: GPL-3.0-or-later
#
# Win32 实现，对应 macOS 的 EVEOPreviewPlatform（架构文档 3.1 节、第 4 节）。
# 整个 crate 只在 Windows 上有内容；unsafe 只出现在这里，每处都写明前提。

[package]
name = "eveo-platform-win"
description = "EVE-O Preview 的 Windows 平台层：窗口发现、DWM 缩略图、激活、热键、前台跟踪"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
eveo-core.workspace = true
windows.workspace = true

# 工作区禁止 unsafe；平台层要调 Win32，单独列出同样的检查，只把 unsafe 放开，并要求 unsafe 函数里也写 unsafe 块。
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
