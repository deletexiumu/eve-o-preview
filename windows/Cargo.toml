# Windows 版的 Rust 工作区。crate 划分见 docs/windows/architecture.md 3.1 节：
# 现在只有纯逻辑的 eveo-core，平台层、界面与可执行文件在后续里程碑加入。
# 默认成员只放与 Windows 无关的 crate，这样在 Linux 上 `cargo test` 也能全过。

[workspace]
resolver = "3"
members = ["crates/eveo-core"]
default-members = ["crates/eveo-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/deletexiumu/eve-o-preview"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
