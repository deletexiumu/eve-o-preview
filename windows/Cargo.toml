# SPDX-License-Identifier: GPL-3.0-or-later
#
# Windows 版的 Rust 工作区。crate 划分见 docs/windows/architecture.md 3.1 节：
# eveo-core 是纯逻辑；eveo-app-core 是协调器；eveo-platform-win 是 Win32 实现；eveo-fake-client 与 eveo-probe 用于集成探针（M3）。
# 界面与可执行文件在后续里程碑加入。
# 默认成员只放与 Windows 无关的 crate，这样在 Linux 上 `cargo test` 也能全过；
# 平台相关的 crate 在非 Windows 系统上编译成空壳，由 `cargo check --target x86_64-pc-windows-msvc` 检查。

[workspace]
resolver = "3"
members = [
    "crates/eveo-core",
    "crates/eveo-l10n",
    "crates/eveo-app-core",
    "crates/eveo-app",
    "crates/eveo-platform-win",
    "crates/eveo-fake-client",
    "crates/eveo-probe",
    "crates/eveo-ui",
]
default-members = [
    "crates/eveo-core",
    "crates/eveo-l10n",
    "crates/eveo-app-core",
    "crates/eveo-app",
    "crates/eveo-platform-win",
    "crates/eveo-fake-client",
    "crates/eveo-probe",
    "crates/eveo-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/deletexiumu/eve-o-preview"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
# 更新包的核对：校验和文件的 ed25519 签名（只用验签）与 SHA-256。
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
sha2 = "0.10"
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4"] }
raw-window-handle = "0.6"
# 只开基础特性；各 crate 按需加后端与渲染器（探针用 winit 后端，界面截图用软件渲染器）。
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2"] }
eveo-core = { path = "crates/eveo-core" }
eveo-l10n = { path = "crates/eveo-l10n" }
eveo-app-core = { path = "crates/eveo-app-core" }
eveo-platform-win = { path = "crates/eveo-platform-win" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# panic 时直接结束进程（panic 钩子先把 fault 行写进日志）。默认的 unwind 下，主线程上的 panic 被 winit 的
# 事件循环接住存起来，应用不退出也不再跑定时器，成了半死状态；真机上验证过（M7b）。结束进程后 WER 留下报告，
# 下次启动按崩溃处理。cargo test 不受这个设置影响（测试总是 unwind）。
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
